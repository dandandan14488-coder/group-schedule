{% extends 'base.html' %}
{% block content %}
    <h2>Вход в систему</h2>
    <form method="POST">
        <label>Логин:</label>
        <input type="text" name="username" required>

        <label>Пароль:</label>
        <input type="password" name="password" required>

        <button type="submit">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
{% endblock %}
