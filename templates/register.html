
{% extends "base.html" %}

{% block title %}Тіркелу{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Жаңа аккаунт</h1>

    <p class="muted">
        БҚ 24-3 тобына тіркелу
    </p>

    <form method="post">

        <label for="username">
            Логин
        </label>

        <input
            id="username"
            name="username"
            type="text"
            required
        >

        <label for="password">
            Пароль (кемінде 6 таңба)
        </label>

        <input
            id="password"
            name="password"
            type="password"
            minlength="6"
            required
        >

        <label for="group_name">
            Оқу тобы
        </label>

        <input
            id="group_name"
            name="group_name"
            value="БҚ 24-3"
            readonly
        >

        <button type="submit">
            Тіркелу
        </button>

    </form>

    <p>
        Аккаунтыңыз бар ма?

        <a href="{{ url_for('login') }}">
            Кіру
        </a>
    </p>

</div>

{% endblock %}
